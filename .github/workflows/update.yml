name: ページ自動更新

on:
  # PC(Mac)の毎日の初回起動時にトリガーされる(~/bin/doteppan_update_trigger.sh から)。
  # GitHubの画面から手動でも実行できる(今すぐ更新したいとき用)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: スプレッドシートからページを再生成
        run: python3 build.py

      - name: 変更があればコミットして公開
        run: |
          # 動画リスト(videos.json)に変化がない場合は、時刻だけの差分を捨てて終了
          if git diff --quiet videos.json; then
            git checkout -- index.html
            echo "変更なし。公開ページはそのままです。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html videos.json
            git commit -m "自動更新: マニュアル動画一覧 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            git push
          fi
